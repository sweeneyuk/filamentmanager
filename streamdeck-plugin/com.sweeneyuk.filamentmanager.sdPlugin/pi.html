<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Property Inspector</title>
  <style>
    body {
      background-color: #2d2d2d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 10px;
      margin: 0;
    }
    .sdpi-item {
      display: flex;
      flex-direction: row;
      align-items: center;
      margin-bottom: 15px;
    }
    .sdpi-item-label {
      width: 100px;
      font-size: 13px;
    }
    .sdpi-item-value {
      flex: 1;
    }
    input[type=text], select {
      width: 100%;
      background-color: #1a1a1f;
      border: 1px solid #333338;
      color: #fff;
      padding: 5px;
      border-radius: 4px;
    }
    button {
      background-color: #00c853;
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #00e676;
    }
  </style>
</head>
<body>

  <div class="sdpi-wrapper">
    <div class="sdpi-item">
      <div class="sdpi-item-label">Server URL</div>
      <div class="sdpi-item-value">
        <input type="text" id="serverUrl" placeholder="http://localhost:3000">
      </div>
    </div>
    
    <div class="sdpi-item">
      <div class="sdpi-item-label">Username</div>
      <div class="sdpi-item-value">
        <input type="text" id="username" placeholder="admin">
      </div>
    </div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">Password</div>
      <div class="sdpi-item-value">
        <input type="password" id="password" placeholder="********">
      </div>
    </div>
    
    <div class="sdpi-item" id="segmentWrapper" style="display: none;">
      <div class="sdpi-item-label">Segment</div>
      <div class="sdpi-item-value">
        <select id="segment">
          <option value="1">1 (Far Left)</option>
          <option value="2">2 (Middle Left)</option>
          <option value="3">3 (Center)</option>
          <option value="4">4 (Middle Right)</option>
          <option value="5">5 (Far Right)</option>
        </select>
      </div>
    </div>

    <div class="sdpi-item" id="appPathWrapper" style="display: none;">
      <div class="sdpi-item-label">App Path (.lnk)</div>
      <div class="sdpi-item-value">
        <input type="text" id="appPath" placeholder="C:\Users\...\Filament Manager.lnk">
      </div>
    </div>

    <div class="sdpi-item">
      <button id="saveBtn">Save Settings</button>
    </div>
  </div>

  <script src="pi.js"></script>
</body>
</html>
